<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in space | Lunevra</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; background: #04060d; color: #e6f1ff; font: 500 18px/1.5 system-ui, sans-serif; }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0 0 8px; color: #00e5ff; letter-spacing: .04em; }
    a { display: inline-block; margin-top: 18px; padding: 12px 22px; background: #00e5ff; color: #021018; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>404: lost in space</h1>
    <p>That page drifted out of range. Let’s get you back to base.</p>
    <a id="home" href="/">Back to Lunevra</a>
  </main>
  <script>
    // GitHub project sites live under /<repo>/, so there the site root is the first path segment.
    var seg = location.pathname.split('/')[1];
    document.getElementById('home').href = location.hostname.endsWith('github.io') && seg ? '/' + seg + '/' : '/';
  </script>
</body>
</html>
